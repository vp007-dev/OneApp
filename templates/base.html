<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>{% block title %}TractorCare{% endblock %} — Vehicle Insurance Intelligence</title>
  <meta name="description" content="Production-grade vehicle insurance and fleet renewal tracking SaaS." />
  <meta name="theme-color" content="#c2d0c7" id="meta-theme" />
  
  <link rel="manifest" href="/static/pwa/manifest.json" />
  <link rel="icon" type="image/png" href="/static/img/avatar_hanna.jpg" />
  <link rel="apple-touch-icon" href="/static/img/avatar_hanna.jpg" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    };
  </script>
  <link rel="stylesheet" href="/static/css/style.css" />
  <meta name="csrf-token" content="{{ csrf_token or '' }}" />
</head>

<body class="app-body">
  <!-- Topbar Header on Sage Canvas -->
  <header class="canvas-topbar">
    <div class="flex items-center gap-3">
      {% if back %}
      <a href="{{ back }}" class="back-circle-btn" title="Go back" aria-label="Go back" style="width: 34px; height: 34px; background: rgba(0,0,0,0.08); border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #111;">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
      </a>
      {% endif %}

      <a href="/" class="brand-badge">
        <span class="brand-dot"></span>
        <span class="font-display">TractorCare</span>
        <span class="text-[10px] bg-[#111317] text-white px-2 py-0.5 rounded-full font-mono uppercase tracking-wider ml-1">SaaS</span>
      </a>
    </div>

    <!-- Right Action Items -->
    <div class="flex items-center gap-2">
      <!-- Dark canvas toggle -->
      <button class="circle-btn-action" id="theme-btn" title="Toggle canvas theme" style="background: rgba(0,0,0,0.08); color: #111; width: 34px; height: 34px;">
        <svg id="icon-moon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.002 9.002 0 0012 21a9.002 9.002 0 008.354-5.646z" /></svg>
        <svg id="icon-sun" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
      </button>

      {% if request.session.get("logged_in") %}
      <!-- Export Dropdown -->
      <div class="relative group hidden sm:block">
        <button class="pill-dropdown-light" title="Export data" style="padding: 6px 14px;">
          <span>💾</span>
          <span class="text-xs">Export</span>
        </button>
        <div class="absolute right-0 mt-1 w-44 py-1.5 bg-slate-900 border border-slate-700/80 rounded-2xl shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-150 z-50">
          <a href="/export/csv" class="flex items-center gap-2 px-3.5 py-2 text-xs font-semibold text-slate-300 hover:bg-slate-800 hover:text-emerald-400 transition">
            <span>📄</span> Export to CSV
          </a>
          <a href="/export/json" class="flex items-center gap-2 px-3.5 py-2 text-xs font-semibold text-slate-300 hover:bg-slate-800 hover:text-indigo-400 transition">
            <span>💾</span> Full JSON Backup
          </a>
        </div>
      </div>

      <!-- Scan & OCR -->
      <a href="/ocr-upload" class="pill-dropdown-light hidden sm:inline-flex" style="padding: 6px 14px; text-decoration: none;">
        <span>📷</span>
        <span class="text-xs">Scan &amp; OCR</span>
      </a>

      <!-- Add Policy -->
      <a href="/records/new" class="pill-dropdown-light" style="background: var(--color-coral); color: #fff; padding: 6px 14px; text-decoration: none;">
        <span>+</span>
        <span class="text-xs">Add Policy</span>
      </a>

      <!-- Logout -->
      <a href="/logout" class="circle-btn-action" title="Logout" style="background: rgba(255,87,61,0.15); color: var(--color-coral); width: 34px; height: 34px; text-decoration: none;">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
      </a>
      {% else %}
      <a href="/login" class="pill-dropdown-light" style="background: #111; color: #fff; text-decoration: none;">Sign In</a>
      {% endif %}
    </div>
  </header>

  <!-- Main Container -->
  <main class="w-full max-w-7xl mx-auto px-4 sm:px-6 py-6 pb-28">
    {% block content %}{% endblock %}
  </main>

  <!-- Floating Mobile Bottom Nav (Phone Dock Style) -->
  {% if request.session.get("logged_in") %}
  <nav class="sm:hidden fixed bottom-3 inset-x-4 max-w-sm mx-auto bg-[#121215] border border-white/10 rounded-full py-2 px-6 flex items-center justify-around shadow-2xl z-50 backdrop-blur-md">
    <a href="/" class="dock-item {% if request.url.path == '/' %}active{% endif %}" title="Fleet Dashboard">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
    </a>
    <a href="/ocr-upload" class="dock-item {% if request.url.path.startswith('/ocr') %}active{% endif %}" title="Scan &amp; OCR">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
    </a>
    <a href="/records/new" class="dock-item {% if request.url.path.startswith('/records/new') %}active{% endif %}" title="Add Policy">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
    </a>
    <a href="/export/csv" class="dock-item" title="Export CSV">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
    </a>
  </nav>
  {% endif %}

  <!-- Toast Notification System -->
  <div id="toast-container"></div>

  <script>
    // Theme toggle handling (Sage Light vs Dark Canvas)
    const themeBtn = document.getElementById('theme-btn');
    const sunIcon = document.getElementById('icon-sun');
    const moonIcon = document.getElementById('icon-moon');

    function syncThemeIcons() {
      const isDark = document.body.classList.contains('dark-canvas');
      if (sunIcon && moonIcon) {
        sunIcon.classList.toggle('hidden', !isDark);
        moonIcon.classList.toggle('hidden', isDark);
      }
      const meta = document.getElementById('meta-theme');
      if (meta) {
        meta.setAttribute('content', isDark ? '#121516' : '#c2d0c7');
      }
    }

    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        const isDark = document.body.classList.toggle('dark-canvas');
        localStorage.setItem('lead-theme', isDark ? 'dark' : 'light');
        syncThemeIcons();
      });
    }

    try {
      if (localStorage.getItem('lead-theme') === 'dark') {
        document.body.classList.add('dark-canvas');
      }
      syncThemeIcons();
    } catch (e) {}

    // Toast messenger
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = 'toast';
      const icon = type === 'success' 
        ? '<span style="color: var(--color-mint); font-weight: bold;">✓</span>' 
        : '<span style="color: var(--color-coral); font-weight: bold;">⚠️</span>';
      toast.innerHTML = `${icon} <span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(12px)';
        toast.style.transition = 'all 0.2s ease';
        setTimeout(() => toast.remove(), 250);
      }, 3500);
    }

    // Check query toast param
    const urlParams = new URLSearchParams(window.location.search);
    const toastParam = urlParams.get('toast');
    if (toastParam) {
      showToast(decodeURIComponent(toastParam));
      const cleanUrl = window.location.pathname;
      window.history.replaceState({}, document.title, cleanUrl);
    }

    // Global copy helper
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(`Copied ${text} to clipboard!`);
      });
    }

    // Keyboard shortcut '/' to search
    window.addEventListener('keydown', (e) => {
      if (e.key === '/' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
        e.preventDefault();
        const searchInput = document.getElementById('search-input');
        if (searchInput) {
          searchInput.focus();
        }
      }
    });
  </script>
</body>
</html>
